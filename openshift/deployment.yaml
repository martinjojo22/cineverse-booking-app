apiVersion: apps/v1
kind: Deployment
metadata:
  name: cineverse-booking-app
  labels:
    app: cineverse-booking-app
    app.kubernetes.io/part-of: cineverse-suite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cineverse-booking-app
  template:
    metadata:
      labels:
        app: cineverse-booking-app
    spec:
      containers:
        - name: web
          image: quay.io/redhat-developer/nginx-unprivileged:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 128Mi
              cpu: 200m
            requests:
              memory: 64Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cineverse-booking-app
  labels:
    app: cineverse-booking-app
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: cineverse-booking-app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cineverse-booking-app
  labels:
    app: cineverse-booking-app
spec:
  to:
    kind: Service
    name: cineverse-booking-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
